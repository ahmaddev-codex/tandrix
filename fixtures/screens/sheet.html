<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Spreadsheet</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      .ribbon {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        padding: 8px 14px;
        border-bottom: 1px solid #e3e3e3;
        background: #fbfbfb;
      }
      .tool {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 11px;
        color: #444;
      }
      .tool svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: #444;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sep {
        width: 1px;
        height: 36px;
        background: #ddd;
        margin: 0 8px;
      }
      .fmt {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 5px;
        font-size: 14px;
        color: #333;
      }
      .formula {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        border-bottom: 1px solid #e3e3e3;
        font-size: 13px;
      }
      .formula .box {
        flex: 1;
        padding: 4px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        color: #333;
      }
      table {
        border-collapse: collapse;
        font-size: 13px;
      }
      td,
      th {
        border: 1px solid #e6e6e6;
        width: 110px;
        height: 26px;
        padding: 0 6px;
      }
      th {
        background: #f5f5f5;
        font-weight: 500;
        color: #666;
      }
      .grid {
        flex: 1;
        overflow: hidden;
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 6px 14px;
        border-top: 1px solid #e3e3e3;
        font-size: 12px;
        background: #f6f6f6;
      }
      .tabs span {
        padding: 4px 12px;
        border-radius: 5px;
      }
      .tabs .sel {
        background: #fff;
        box-shadow: 0 0 0 1px #ddd;
      }
    </style>
  </head>
  <body>
    <div class="menubar">
      <b>Numbers</b><span>File</span><span>Edit</span><span>Insert</span><span>Table</span
      ><span>Format</span><span>Arrange</span><span>View</span><span>Window</span><span>Help</span>
    </div>
    <div class="win">
      <div class="titlebar">
        <span class="lights"><i></i><i></i><i></i></span>Budget 2026
      </div>
      <div class="ribbon">
        <span class="fmt" data-target="bold"><b>B</b></span>
        <span class="fmt"><i>I</i></span>
        <span class="fmt"><u>U</u></span>
        <span class="sep"></span>
        <span class="tool"
          ><svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M3 10h18M9 4v16" /></svg
          >Table</span
        >
        <span class="tool" data-target="chart"
          ><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7" /></svg>Chart</span
        >
        <span class="tool"
          ><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6" /></svg>Text</span
        >
        <span class="sep"></span>
        <span class="tool" data-target="sort"
          ><svg viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4" /></svg
          >Sort</span
        >
        <span class="tool"
          ><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 8v6l-4-2v-4z" /></svg>Filter</span
        >
        <span class="spacer"></span>
        <span class="tool"
          ><svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 8v8M8 12h8" /></svg
          >Collaborate</span
        >
      </div>
      <div class="formula"><span class="muted">C4</span><span class="box">=SUM(C2:C3)</span></div>
      <div class="grid">
        <table>
          <tr>
            <th></th>
            <th>A</th>
            <th>B</th>
            <th>C</th>
            <th>D</th>
            <th>E</th>
            <th>F</th>
            <th>G</th>
          </tr>
          <tr>
            <th>1</th>
            <td><b>Item</b></td>
            <td><b>Jan</b></td>
            <td><b>Feb</b></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <th>2</th>
            <td>Rent</td>
            <td>1200</td>
            <td>1200</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <th>3</th>
            <td>Food</td>
            <td>420</td>
            <td>380</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <th>4</th>
            <td>Total</td>
            <td>1620</td>
            <td>1580</td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <th>5</th>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <th>6</th>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </table>
      </div>
      <div class="tabs">
        <span class="sel">Q1</span><span>Q2</span><span data-target="q3">Q3</span><span>Q4</span
        ><span>+</span>
      </div>
    </div>
    <script>
      window.__asks = {
        bold: "How do I make this text bold?",
        chart: "How do I add a chart?",
        sort: "How do I sort this table?",
        q3: "How do I get to the Q3 sheet?",
      };
    </script>
  </body>
</html>
