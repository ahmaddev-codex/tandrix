<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Notes</title>
    <link rel="stylesheet" href="teach.css" />
    <style>
      .page {
        position: absolute;
        left: 160px;
        top: 110px;
        font:
          30px/64px "Times New Roman",
          serif;
        color: #111;
      }
      .page div span {
        display: inline-block;
      }
      .q {
        font:
          18px -apple-system,
          sans-serif;
        color: #555;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="menubar"><b>Notes</b><span>File</span><span>Edit</span><span>Format</span></div>
    <div class="win">
      <div class="titlebar"><span class="title">Algebra homework</span></div>
      <div class="content">
        <div class="caption">Question 4</div>
        <div class="page">
          <div class="q">Solve for x.</div>
          <div>
            <span data-part="equation" data-names="equation|original|problem|question"
              >3(x − 2) + 4 = 2x + 9</span
            >
          </div>
          <div>
            <span data-part="expand" data-names="expand|bracket|distribute|3x − 6"
              >3x − 6 + 4 = 2x + 9</span
            >
          </div>
          <div>
            <span data-part="simplify" data-names="simplify|collect|combine|3x − 2"
              >3x − 2 = 2x + 9</span
            >
          </div>
          <div>
            <span data-part="answer" data-names="answer|solution|x = 11|result">x = 11</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__ask = "I have this equation on my screen and I don't understand it";
    </script>
  </body>
</html>
