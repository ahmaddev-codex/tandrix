<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Graph</title>
    <link rel="stylesheet" href="teach.css" />
  </head>
  <body>
    <div class="menubar"><b>Grapher</b><span>File</span><span>Edit</span><span>Equation</span></div>
    <div class="win">
      <div class="titlebar"><span class="title">trig.gcx</span></div>
      <div class="content">
        <div class="caption">y = sin x and y = cos x</div>
        <svg width="1320" height="758" style="position: absolute; left: 0; top: 0" id="plot"></svg>
      </div>
    </div>
    <script>
      const svg = document.getElementById("plot");
      const ox = 140,
        oy = 400,
        sx = 1000 / (4 * Math.PI),
        sy = 160;
      const line = (f) => {
        let d = "";
        for (let i = 0; i <= 400; i++) {
          const x = (i / 400) * 4 * Math.PI;
          d += `${i ? "L" : "M"}${(ox + x * sx).toFixed(1)} ${(oy - f(x) * sy).toFixed(1)} `;
        }
        return d;
      };
      svg.innerHTML = `
        <g stroke="#ddd" stroke-width="1">${[1, 2, 3, 4, 5, 6, 7, 8].map((k) => `<path d="M${ox + (k * Math.PI * sx) / 2} 200 V600"/>`).join("")}</g>
        <path data-part="xaxis" data-names="x-axis|x axis|horizontal axis" d="M${ox - 20} ${oy} H${ox + 1030}" stroke="#333" stroke-width="2"/>
        <path data-part="yaxis" data-names="y-axis|y axis|vertical axis" d="M${ox} 210 V590" stroke="#333" stroke-width="2"/>
        <path data-part="sine" data-names="sine|sin" d="${line(Math.sin)}" stroke="#2e7dff" stroke-width="3" fill="none"/>
        <path data-part="cosine" data-names="cosine|cos" d="${line(Math.cos)}" stroke="#e5484d" stroke-width="3" fill="none"/>
        <text x="${ox + 1040}" y="${oy + 5}" font-size="18">x</text>
        <text x="${ox - 8}" y="200" font-size="18">y</text>
        ${[1, 2, 3, 4].map((k) => `<text x="${ox + k * Math.PI * sx - 12}" y="${oy + 26}" font-size="15" fill="#555">${k === 1 ? "π" : k + "π"}</text>`).join("")}
        <text x="${ox - 30}" y="${oy - sy + 5}" font-size="15" fill="#555">1</text>
        <text x="${ox - 36}" y="${oy + sy + 5}" font-size="15" fill="#555">−1</text>
        <rect x="980" y="120" width="190" height="64" fill="#fff" stroke="#ccc"/>
        <path d="M995 142 H1035" stroke="#2e7dff" stroke-width="3"/><text x="1045" y="148" font-size="16">sin x</text>
        <path d="M995 168 H1035" stroke="#e5484d" stroke-width="3"/><text x="1045" y="174" font-size="16">cos x</text>`;
      window.__ask = "Explain the sine and cosine waves on this graph";
    </script>
  </body>
</html>
