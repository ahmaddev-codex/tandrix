# The parts check on the real models. Needs JOB_ID and JOB_TITLE (the seeded Raspberry Pi 5
# project: Raspberry Pi 5, Active Cooler, Ethernet cable) and its photos in .media (several boards and a keyboard,
# with no cable); see run.sh. The cable is missing, so the step that needs it waits; saying it's
# here releases the step.
appId: app.tandrix.mobile
---
- addMedia:
    - .media/parts-laid-out.jpg
- launchApp:
    permissions:
      all: allow
      camera: deny
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- tapOn:
    id: check-parts
- extendedWaitUntil:
    visible:
      id: choose-photo
    timeout: 30000
- tapOn:
    id: choose-photo
- runFlow:
    file: subflows/pick-photo.yaml
    env:
      INDEX: 0
- tapOn: Check these parts
- extendedWaitUntil:
    visible: ".* of 3 parts found"
    timeout: 120000
- takeScreenshot: parts-checked
# The step that needs the cable waits for it.
- tapOn: ${JOB_TITLE}
- scrollUntilVisible:
    element: "Step 4: Connect the network cable, Missing part: Ethernet cable.*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: step-waiting-for-part
# It turns up: say so on the parts list, and the step is free again.
# The parts list reopens on the latest check: no new photo needed.
- scrollUntilVisible:
    element:
      id: open-parts
    direction: UP
    timeout: 20000
- tapOn:
    id: open-parts
- scrollUntilVisible:
    element: "Ethernet cable, .*Missing"
    direction: DOWN
    timeout: 20000
- tapOn: "Ethernet cable, .*Missing"
- extendedWaitUntil:
    visible:
      id: part-correction
    timeout: 10000
- tapOn:
    id: part-here
- tapOn: ${JOB_TITLE}
- scrollUntilVisible:
    element: "Step 4: Connect the network cable, To do.*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: step-released
