# T11: no manual. The user chooses general steps; every step is labelled Generic, never cited.
# Needs the API with TANDRIX_FIXTURE_MODELS=1 until the model is live.
appId: app.tandrix.mobile
env:
  JOB_TITLE: Generic job e2e ${RUN_ID}
---
- addMedia:
    - assets/sample-part.jpg
- launchApp:
    permissions:
      all: allow
      camera: deny
- runFlow: subflows/open-app.yaml
- tapOn:
    id: new-job
- extendedWaitUntil:
    visible:
      id: job-title
    timeout: 30000
- tapOn:
    id: job-title
- inputText: ${JOB_TITLE}
- tapOn:
    id: create-job
- extendedWaitUntil:
    visible: ${JOB_TITLE},.*
    timeout: 15000
- tapOn: ${JOB_TITLE},.*
- extendedWaitUntil:
    visible:
      id: photograph-nameplate
    timeout: 15000
- tapOn:
    id: photograph-nameplate
- extendedWaitUntil:
    visible:
      id: choose-photo
    timeout: 30000
- tapOn:
    id: choose-photo
- extendedWaitUntil:
    visible:
      text: "Photo, .*"
    timeout: 15000
- tapOn:
    text: "Photo, .*"
    index: 0
- tapOn:
    id: use-photo
- extendedWaitUntil:
    visible:
      id: identify-banner
    timeout: 60000
- tapOn:
    id: asset-make
- eraseText: 120
- inputText: FlowSet
- tapOn:
    id: asset-model
- eraseText: 120
- inputText: GEN-${RUN_ID}
- hideKeyboard
- tapOn:
    id: save-asset
- extendedWaitUntil:
    visible:
      id: generic-steps
    timeout: 15000
- tapOn:
    id: generic-steps
- extendedWaitUntil:
    visible:
      id: step-list
    timeout: 60000
- assertVisible: 4 steps
- assertVisible: "Step 1: .*, To do, Generic, not from the manufacturer"
- assertNotVisible: ".*Manual p.*"
- assertNotVisible:
    id: generic-steps
- takeScreenshot: job-with-generic-steps
