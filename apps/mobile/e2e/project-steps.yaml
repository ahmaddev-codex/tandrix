# P2/P4: a project from one sentence, with no equipment. Writing the steps gives general steps
# from the goal, every one labelled Generic, including the part done on the Mac.
# Needs the API with TANDRIX_FIXTURE_MODELS=1 until the model is live.
appId: app.tandrix.mobile
---
- runFlow: subflows/open-app.yaml
- tapOn: Assemble a 12U home server rack
- extendedWaitUntil:
    visible:
      id: create-job
    timeout: 10000
- tapOn:
    id: create-job
- extendedWaitUntil:
    visible:
      id: write-project-steps
    timeout: 15000
- takeScreenshot: project-start
- tapOn:
    id: write-project-steps
- extendedWaitUntil:
    visible: 4 steps
    timeout: 60000
- assertVisible: "Step 1: Check every part is there,.*Generic, not from the manufacturer"
- scrollUntilVisible:
    element: "Step 4: Set it up on the computer,.*"
    direction: DOWN
    # Centred, so the fixed bottom bar never covers the row being tapped.
    centerElement: true
- takeScreenshot: project-steps
