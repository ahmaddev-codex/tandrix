# Identify the equipment from a photo of its box, on the real model, and save it.
# Needs JOB_ID and JOB_TITLE (an empty project) and its photos in .media (the Raspberry Pi 5 box); see run.sh.
appId: app.tandrix.mobile
---
- addMedia:
    - .media/box-label.jpg
- launchApp:
    permissions:
      all: allow
      camera: deny
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- tapOn:
    id: photograph-nameplate
- extendedWaitUntil:
    visible:
      id: choose-photo
    timeout: 30000
- tapOn:
    id: choose-photo
- runFlow:
    file: subflows/pick-photo.yaml
    env:
      INDEX: 0
- tapOn:
    id: use-photo
- extendedWaitUntil:
    visible:
      id: identify-banner
    timeout: 60000
# The model reads the box: make and model filled in for the user to confirm.
- assertVisible: "Raspberry Pi"
- takeScreenshot: identify-result
- hideKeyboard
- tapOn:
    id: save-asset
- extendedWaitUntil:
    visible: "Equipment: Raspberry Pi.*"
    timeout: 15000
- takeScreenshot: job-with-equipment
