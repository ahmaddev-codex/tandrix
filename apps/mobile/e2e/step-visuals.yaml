# P7: a step's pictures. Add your own reference photo to a step, see it on the step and full
# screen, then remove it; no model calls. Needs JOB_ID and JOB_TITLE (the seeded Raspberry Pi 5
# project) and its photos in .media (the fitted board); see run.sh.
appId: app.tandrix.mobile
env:
  STEP: "Step 2: Fit the Active Cooler"
---
- addMedia:
    - .media/board-with-cooler.jpg
# Camera denied, so the photo comes from the picker.
- launchApp:
    permissions:
      all: allow
      camera: deny
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- runFlow: subflows/open-step.yaml
# A generic step with no photos yet has no pictures, only the way to add one.
- assertNotVisible:
    id: step-visual
- scrollUntilVisible:
    element:
      id: add-reference
    centerElement: true
- tapOn:
    id: add-reference
- extendedWaitUntil:
    visible:
      id: choose-photo
    timeout: 10000
- tapOn:
    id: choose-photo
- runFlow:
    file: subflows/pick-photo.yaml
    env:
      INDEX: 0
- tapOn: Use as reference
- extendedWaitUntil:
    visible:
      id: step-visual
    timeout: 30000
- scrollUntilVisible:
    element:
      id: remove-reference
    centerElement: true
- assertVisible: "Your reference"
- takeScreenshot: step-reference
- tapOn:
    id: step-visual-frame
- extendedWaitUntil:
    visible:
      id: close-image
    timeout: 5000
- tapOn:
    id: close-image
- tapOn:
    id: remove-reference
# The photo stays with the step: it's now shown as the step's latest photo, not the reference.
- extendedWaitUntil:
    visible: "Your last photo"
    timeout: 15000
- assertNotVisible: "Your reference"
- assertVisible:
    id: add-reference
