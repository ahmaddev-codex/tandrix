# Check a step by photo with the real model: the bare board needs attention, the board with the
# cooler fitted is verified. Needs JOB_ID and JOB_TITLE (the seeded Raspberry Pi 5 project) and
# its photos in .media (the bare board newest, the fitted board before it); see run.sh.
appId: app.tandrix.mobile
env:
  STEP: "Step 2: Fit the Active Cooler"
---
- addMedia:
    - .media/board-with-cooler.jpg
    - .media/board-top.jpg
- launchApp:
    permissions:
      all: allow
      camera: deny
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- runFlow: subflows/open-step.yaml
- scrollUntilVisible:
    element:
      id: start-step
    direction: DOWN
    timeout: 20000
- tapOn:
    id: start-step
- scrollUntilVisible:
    element:
      id: check-work
    direction: DOWN
    timeout: 20000
- tapOn:
    id: check-work
# Camera denied: choose the photo of the finished step.
- extendedWaitUntil:
    visible: "Check your work: take or choose a photo of the finished step."
    timeout: 15000
- tapOn:
    id: choose-photo
- runFlow:
    file: subflows/pick-photo.yaml
    env:
      INDEX: 0
- tapOn: Check this photo
- extendedWaitUntil:
    visible:
      id: check-result
    timeout: 90000
- assertVisible: Needs attention
- takeScreenshot: check-needs-attention
- scrollUntilVisible:
    element: Check again
    direction: DOWN
    timeout: 20000
- tapOn: Check again
- tapOn:
    id: choose-photo
- runFlow:
    file: subflows/pick-photo.yaml
    env:
      INDEX: 1
- tapOn: Check this photo
- extendedWaitUntil:
    visible: Looks right
    timeout: 90000
- scrollUntilVisible:
    element: Verified
    direction: DOWN
    timeout: 20000
- takeScreenshot: check-verified
