# Highlight a step's parts on a photo with the real models, and correct the highlight.
# Needs JOB_ID and JOB_TITLE (the seeded Raspberry Pi 5 project) and its photos in .media (the bare board);
# see run.sh. The board is in the photo; the Active Cooler isn't, so it's reported not found.
appId: app.tandrix.mobile
env:
  STEP: "Step 2: Fit the Active Cooler"
---
- addMedia:
    - .media/board-top.jpg
- launchApp:
    permissions:
      all: allow
      camera: deny
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- runFlow: subflows/open-step.yaml
- assertVisible: "Step 2 of 5"
# Without a highlight yet, the step's parts are listed by number.
- assertVisible: "1. Raspberry Pi 5"
- assertVisible: "2. Active Cooler"
- tapOn:
    id: choose-photo
- runFlow:
    file: subflows/pick-photo.yaml
    env:
      INDEX: 0
- tapOn: Find the parts
- extendedWaitUntil:
    visible:
      id: part-highlight
    timeout: 90000
- extendedWaitUntil:
    visible: "Not found in this photo: Active Cooler.*"
    timeout: 10000
- takeScreenshot: step-highlight
# Confirm the board: its label opens the correction panel.
- tapOn: "Raspberry Pi 5.*"
- extendedWaitUntil:
    visible:
      id: correct-panel
    timeout: 5000
- tapOn:
    id: confirm-highlight
- assertNotVisible:
    id: correct-panel
- takeScreenshot: step-highlight-confirmed
