# Handoff, phone side: a step done on a computer offers "Continue on Mac"; sending it leaves the
# phone waiting on the Mac. Needs JOB_ID and JOB_TITLE (the seeded project; see run.sh).
appId: app.tandrix.mobile
env:
  STEP: "Step 5: Write Raspberry Pi OS to the card"
---
- launchApp
- runFlow: ../subflows/open-app.yaml
- runFlow: ../subflows/open-job.yaml
- runFlow: ../subflows/open-step.yaml
- extendedWaitUntil:
    visible:
      id: handoff-offer
    timeout: 15000
- takeScreenshot: handoff-offer
- tapOn: Continue on Mac
- extendedWaitUntil:
    visible:
      id: handoff-waiting
    timeout: 10000
- takeScreenshot: handoff-waiting
