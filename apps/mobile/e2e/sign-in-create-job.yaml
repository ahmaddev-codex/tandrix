# Sign in, start a project from its goal alone, restart: still signed in and the project listed.
# Real models: setting up writes general steps from the goal (one model call, a few cents).
#   sh apps/mobile/e2e/run.sh
appId: app.tandrix.mobile
env:
  # Plain text only: Maestro matches visible text as a regular expression. RUN_ID (set by run.sh)
  # keeps the title unique, so leftovers from earlier runs can't satisfy the checks.
  JOB_TITLE: Assemble a 12U home server rack ${RUN_ID}
---
- launchApp:
    clearState: true
# Same link `expo run:ios` uses: loads the local bundle and skips the dev-menu onboarding and button.
- openLink: exp+tandrix://?__expo_url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1
# iOS asks before a link opens the app ("Open in Tandrix?").
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
# Wait for the app to finish loading (signed in or not) before deciding anything.
- extendedWaitUntil:
    visible:
      text: "(Local test sign-in|Start a project|Get started)"
    timeout: 60000
# The keychain can outlive clearState on iOS, so sign out first if a session survived.
- runFlow:
    when:
      visible:
        id: open-settings
    commands:
      - tapOn:
          id: open-settings
      - tapOn:
          id: settings-sign-out
# Signed out on a fresh install: the welcome screen first.
- extendedWaitUntil:
    visible: "(Local test sign-in|Get started)"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: get-started
    commands:
      - takeScreenshot: welcome
      - tapOn:
          id: get-started
      - extendedWaitUntil:
          visible: Local test sign-in
          timeout: 15000
- tapOn: Local test sign-in
- tapOn:
    id: email
- inputText: ${DEV_USER_EMAIL}
- tapOn:
    id: password
- inputText: ${DEV_USER_PASSWORD}
- tapOn:
    id: password-sign-in
- extendedWaitUntil:
    visible:
      id: new-job
    timeout: 15000
- takeScreenshot: home
- runFlow: subflows/new-job.yaml
- tapOn:
    id: job-title
- inputText: ${JOB_TITLE}
- hideKeyboard
- takeScreenshot: intake
- scrollUntilVisible:
    element:
      id: create-job
    centerElement: true
- tapOn:
    id: create-job
# Set up in visible stages; with nothing to report it opens the project by itself.
- extendedWaitUntil:
    visible:
      id: stage-steps
    timeout: 15000
- takeScreenshot: setting-up
- extendedWaitUntil:
    visible:
      id: step-list
    timeout: 180000
# No manual: every step is labelled Generic.
- assertVisible: "Step 1: .*Generic, not from the manufacturer.*"
- takeScreenshot: project-steps
# Restart: the session comes back from the keychain and the project from the API.
- stopApp
- launchApp
- openLink: exp+tandrix://?__expo_url=http%3A%2F%2F127.0.0.1%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    # Project rows expose one accessibility label: "<title>, <status>".
    visible: ${JOB_TITLE},.*
    timeout: 30000
- assertNotVisible: Local test sign-in
- takeScreenshot: jobs-after-restart
