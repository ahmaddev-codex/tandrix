# Photograph a two-page kit sheet as the manual, then write the steps from it on the real model:
# the steps cite its pages. Needs JOB_ID and JOB_TITLE (a project for "Cooler kit CK-5", no manual)
# and its photos in .media (the kit sheet's two pages, page 1 newest); see run.sh. The search for the manual runs
# for real and may or may not find anything; the pages are added either way.
appId: app.tandrix.mobile
---
- addMedia:
    - .media/page-2.jpg
    - .media/page-1.jpg
- launchApp:
    permissions:
      all: allow
      camera: deny
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- tapOn:
    id: find-manual
- extendedWaitUntil:
    visible:
      id: photograph-pages
    timeout: 90000
- takeScreenshot: manual-search
- tapOn:
    id: photograph-pages
- extendedWaitUntil:
    visible:
      id: choose-pages
    timeout: 30000
- assertVisible: No pages yet
- tapOn:
    id: choose-pages
# Pages in order: page 1 (newest), then page 2.
- runFlow:
    file: subflows/pick-photo.yaml
    env:
      INDEX: 0
- tapOn:
    text: "Photo, .*"
    index: 1
# The multi-select picker confirms with a check button (id Add, label Done).
- tapOn:
    id: Add
- extendedWaitUntil:
    visible: 2 pages
    timeout: 30000
- takeScreenshot: manual-pages
- tapOn:
    id: make-manual
- extendedWaitUntil:
    visible:
      id: manual-card
    timeout: 30000
- assertVisible: Your copy
- takeScreenshot: job-with-manual
- tapOn:
    id: write-steps
- extendedWaitUntil:
    visible:
      id: step-list
    timeout: 180000
# Each row is one button labelled with its title, status and source.
- assertVisible: "Step 1: .*Manual p\\.[12].*"
- takeScreenshot: job-with-steps
