# T8: add a photo to a job and see it in the job's photos.
# The e2e script revokes camera access first, so this also proves the fallback: with the camera
# refused, the app explains why and still lets you choose a photo.
appId: app.tandrix.mobile
env:
  JOB_TITLE: Photo job e2e ${RUN_ID}
---
- addMedia:
    - assets/sample-part.jpg
- launchApp
- runFlow: subflows/open-app.yaml
- tapOn:
    id: new-job
- tapOn:
    id: job-title
- inputText: ${JOB_TITLE}
- tapOn:
    id: create-job
- extendedWaitUntil:
    visible: ${JOB_TITLE},.*
    timeout: 15000
- tapOn: ${JOB_TITLE},.*
- extendedWaitUntil:
    visible: No photos yet
    timeout: 15000
- tapOn:
    id: take-photo
- extendedWaitUntil:
    visible: Camera access is off for Tandrix.*
    timeout: 10000
- takeScreenshot: camera-denied
- tapOn:
    id: choose-photo
# System photo picker: pick the most recent photo (the one added above). Thumbnails are
# labelled "Photo, <date>"; the comma keeps the "Photos" tab from matching.
- extendedWaitUntil:
    visible:
      text: "Photo, .*"
    timeout: 15000
- tapOn:
    text: "Photo, .*"
    index: 0
- extendedWaitUntil:
    visible:
      id: use-photo
    timeout: 15000
- takeScreenshot: photo-preview
- tapOn:
    id: use-photo
- extendedWaitUntil:
    visible: 1 photo
    timeout: 30000
- assertVisible:
    id: evidence-photo
- takeScreenshot: job-with-photo
