# Add a photo to a project through the photo picker (the camera is denied at launch).
# Needs JOB_ID and JOB_TITLE (an empty project) and its photos in .media (one photo); see run.sh. No model calls.
appId: app.tandrix.mobile
---
- addMedia:
    - .media/board-top.jpg
- launchApp:
    permissions:
      all: allow
      camera: deny
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- scrollUntilVisible:
    element: No photos yet
    centerElement: true
- tapOn:
    id: take-photo
- extendedWaitUntil:
    visible:
      id: choose-photo
    timeout: 30000
- extendedWaitUntil:
    visible: Camera access is off for Tandrix.*
    timeout: 10000
- takeScreenshot: camera-denied
- tapOn:
    id: choose-photo
- runFlow:
    file: subflows/pick-photo.yaml
    env:
      INDEX: 0
- extendedWaitUntil:
    visible:
      id: use-photo
    timeout: 15000
- takeScreenshot: photo-preview
- tapOn:
    id: use-photo
- extendedWaitUntil:
    visible: 1 photo
    timeout: 30000
- assertVisible:
    id: evidence-photo
- takeScreenshot: job-with-photo
