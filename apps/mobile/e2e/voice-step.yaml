# Hold to talk on a step: record, transcribe on the real model, and reply aloud and on screen.
# The simulator's microphone can't be given real speech here, so the reply is an answer or
# "Tandrix didn't catch that"; either way a Tandrix turn appears. Speech itself is a physical-
# device check. Needs JOB_ID and JOB_TITLE (the seeded Raspberry Pi 5 project); see run.sh.
appId: app.tandrix.mobile
env:
  STEP: "Step 2: Fit the Active Cooler"
---
- launchApp:
    permissions:
      all: allow
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- runFlow: subflows/open-step.yaml
- scrollUntilVisible:
    element:
      id: talk
    direction: DOWN
    timeout: 20000
# Hold to talk, then let go.
- longPressOn:
    id: talk
- extendedWaitUntil:
    visible:
      id: voice-transcript
    timeout: 10000
- extendedWaitUntil:
    visible: "Tandrix"
    timeout: 60000
- takeScreenshot: voice-reply
