# Talking on a step. A tap keeps listening (a pause or a second tap sends); a hold sends on
# letting go. The simulator's microphone can't be given real speech here, so a turn ends in an
# answer or "Didn't hear anything" (silence is never sent); either way a Tandrix turn appears.
# Speech itself is a physical-device check. Needs JOB_ID and JOB_TITLE (the seeded Raspberry Pi 5 project); see run.sh.
appId: app.tandrix.mobile
env:
  STEP: "Step 2: Fit the Active Cooler"
---
- launchApp:
    permissions:
      all: allow
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- runFlow: subflows/open-step.yaml
# Centred, so the mic isn't under the step's bottom bar when it's tapped.
- scrollUntilVisible:
    element:
      id: talk
    direction: DOWN
    centerElement: true
    timeout: 20000
# A tap: Tandrix keeps listening and says how the turn ends; a second tap ends it.
- tapOn:
    id: talk
- extendedWaitUntil:
    visible: "Listening. Pause or tap the mic to send."
    timeout: 10000
- takeScreenshot: voice-tap-listening
- tapOn:
    id: talk
- extendedWaitUntil:
    visible: "Tandrix"
    timeout: 60000
# A hold: talk, then let go. Centre the mic again first: the answer can move the page.
- scrollUntilVisible:
    element:
      id: talk
    direction: DOWN
    centerElement: true
    timeout: 20000
- longPressOn:
    id: talk
- extendedWaitUntil:
    visible:
      id: voice-transcript
    timeout: 10000
- extendedWaitUntil:
    visible: "Tandrix"
    timeout: 60000
- takeScreenshot: voice-reply
