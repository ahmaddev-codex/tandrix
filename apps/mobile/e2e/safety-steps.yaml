# Safety gates and finishing steps; no model calls. Needs JOB_ID and JOB_TITLE (the seeded
# Raspberry Pi 5 project); see run.sh. Step 1 (power off) can't start until its gate is
# confirmed; step 3 (torque) takes a measured value and refuses one outside the range.
appId: app.tandrix.mobile
---
- launchApp
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-job.yaml
- runFlow:
    file: subflows/open-step.yaml
    env:
      STEP: "Step 1: Power off and unplug the Pi"
- extendedWaitUntil:
    visible: Confirm isolated
    timeout: 15000
- assertNotVisible:
    id: start-step
- takeScreenshot: safety-gate
- tapOn: Confirm isolated
- extendedWaitUntil:
    visible: "Confirmed at .*"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: start-step
    direction: DOWN
    timeout: 20000
- tapOn:
    id: start-step
- extendedWaitUntil:
    visible: In progress
    timeout: 10000
- scrollUntilVisible:
    element:
      id: mark-done
    direction: DOWN
    timeout: 20000
- tapOn:
    id: mark-done
- extendedWaitUntil:
    visible: You confirmed
    timeout: 10000
- assertVisible:
    id: reopen-step
- takeScreenshot: step-done
# Step 3: a torque value outside the range is refused.
# iOS has no system back: tap the header's back button, labelled with the project title.
- runFlow: subflows/back-to-job.yaml
- runFlow:
    file: subflows/open-step.yaml
    env:
      STEP: "Step 3: Tighten the standoff screws"
- scrollUntilVisible:
    element:
      id: start-step
    direction: DOWN
    timeout: 20000
- tapOn:
    id: start-step
- scrollUntilVisible:
    element:
      id: measured-value
    direction: DOWN
    timeout: 20000
- tapOn:
    id: measured-value
- inputText: "2"
- hideKeyboard
- tapOn:
    id: save-measurement
# The refusal shows as the field's error.
- extendedWaitUntil:
    visible: ".*specifies 0\\.4 Nm\\."
    timeout: 10000
- assertVisible: In progress
- takeScreenshot: measurement-refused
- tapOn:
    id: measured-value
- eraseText: 10
- inputText: "0.4"
- hideKeyboard
- tapOn:
    id: save-measurement
- extendedWaitUntil:
    visible: You confirmed
    timeout: 10000
- takeScreenshot: measurement-saved
