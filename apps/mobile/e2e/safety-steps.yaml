# T13: safety gates and finishing steps. Needs the API with TANDRIX_FIXTURE_MODELS=1 until the
# model is live. Step 1 (isolate and drain) has two gates and can't start until both are
# confirmed; step 4 (torque) takes a measured value and refuses one outside the manual's range.
appId: app.tandrix.mobile
env:
  JOB_TITLE: Safety job e2e ${RUN_ID}
---
- addMedia:
    - assets/sample-part.jpg
- launchApp:
    permissions:
      all: allow
      camera: deny
- runFlow: subflows/open-app.yaml
- runFlow: subflows/new-job.yaml
- tapOn:
    id: job-title
- inputText: ${JOB_TITLE}
- tapOn:
    id: create-job
- extendedWaitUntil:
    visible: ${JOB_TITLE},.*
    timeout: 15000
- tapOn: ${JOB_TITLE},.*
- extendedWaitUntil:
    visible:
      id: photograph-nameplate
    timeout: 15000
- tapOn:
    id: photograph-nameplate
- extendedWaitUntil:
    visible:
      id: choose-photo
    timeout: 30000
- tapOn:
    id: choose-photo
- extendedWaitUntil:
    visible:
      text: "Photo, .*"
    timeout: 15000
- tapOn:
    text: "Photo, .*"
    index: 0
- tapOn:
    id: use-photo
- extendedWaitUntil:
    visible:
      id: identify-banner
    timeout: 60000
- tapOn:
    id: asset-make
- eraseText: 120
- inputText: FlowSet
- tapOn:
    id: asset-model
- eraseText: 120
- inputText: SAFE-${RUN_ID}
- hideKeyboard
- tapOn:
    id: save-asset
- extendedWaitUntil:
    visible:
      id: generic-steps
    timeout: 15000
- tapOn:
    id: generic-steps
- extendedWaitUntil:
    visible:
      id: step-list
    timeout: 60000
# Step 1: two gates before it can start.
- tapOn: "Step 1: Isolate and drain the pump,.*"
- extendedWaitUntil:
    visible: Confirm isolated
    timeout: 15000
- assertVisible: Confirm pressure released
- assertNotVisible:
    id: start-step
- takeScreenshot: safety-gates
- tapOn: Confirm isolated
- extendedWaitUntil:
    visible: "Confirmed at .*"
    timeout: 10000
- assertNotVisible:
    id: start-step
- tapOn: Confirm pressure released
- scrollUntilVisible:
    element:
      id: start-step
    direction: DOWN
    timeout: 20000
- takeScreenshot: safety-gates-confirmed
- tapOn:
    id: start-step
- extendedWaitUntil:
    visible: In progress
    timeout: 10000
- scrollUntilVisible:
    element:
      id: mark-done
    direction: DOWN
    timeout: 20000
- tapOn:
    id: mark-done
- extendedWaitUntil:
    visible: You confirmed
    timeout: 10000
- assertVisible:
    id: reopen-step
- takeScreenshot: step-done
# Step 4: a torque value outside the manual's range is refused.
# iOS has no system back: tap the header's back button, labelled with the job title.
- tapOn: ${JOB_TITLE}
- extendedWaitUntil:
    visible:
      id: step-list
    timeout: 15000
- scrollUntilVisible:
    element: "Step 4: Torque the casing bolts,.*"
    direction: DOWN
- tapOn: "Step 4: Torque the casing bolts,.*"
- extendedWaitUntil:
    visible:
      id: step-card
    timeout: 15000
- scrollUntilVisible:
    element:
      id: start-step
    direction: DOWN
    timeout: 20000
- tapOn:
    id: start-step
- scrollUntilVisible:
    element:
      id: measured-value
    direction: DOWN
    timeout: 20000
- tapOn:
    id: measured-value
- inputText: "30"
- hideKeyboard
- tapOn:
    id: save-measurement
# The refusal shows as the field's error.
- extendedWaitUntil:
    visible: "The manual specifies 25 Nm\\."
    timeout: 10000
- assertVisible: In progress
- takeScreenshot: measurement-refused
- tapOn:
    id: measured-value
- eraseText: 10
- inputText: "25"
- hideKeyboard
- tapOn:
    id: save-measurement
- extendedWaitUntil:
    visible: You confirmed
    timeout: 10000
- takeScreenshot: measurement-saved
