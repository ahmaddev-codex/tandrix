# Back from a step to the project, with the header's back button (labelled with the project
# title; iOS has no system back). A tap during the screen's transition can be lost, so it's
# retried until the step list shows.
appId: app.tandrix.mobile
---
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: step-list
          commands:
            - tapOn: ${JOB_TITLE}
      - extendedWaitUntil:
          visible:
            id: step-list
          timeout: 8000
