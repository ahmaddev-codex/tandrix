# Opens the new-job form from the home's Start a project button. Right after launch the home may
# still be loading and swallow the first tap, so it's retried once the form hasn't appeared.
appId: app.tandrix.mobile
---
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: new-job
      - extendedWaitUntil:
          visible:
            id: job-title
          timeout: 10000
