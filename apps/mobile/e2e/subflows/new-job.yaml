# Opens the new-job form from the home menu. Right after launch the home may still be loading and
# swallow the first tap, so it's retried once the form hasn't appeared.
appId: app.tandrix.mobile
---
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: new-job
          commands:
            - tapOn:
                id: dashboard-menu
            - extendedWaitUntil:
                visible:
                  id: new-job
                timeout: 5000
      - tapOn:
          id: new-job
      - extendedWaitUntil:
          visible:
            id: job-title
          timeout: 10000
