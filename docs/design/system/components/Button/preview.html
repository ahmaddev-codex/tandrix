<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="root" class="tx-col"></div>
<script>
  var T = window.Tandrix, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', {className:'tx-row', style:{padding:0}},
      h(T.Button, {variant:'primary'}, 'Continue on Mac'),
      h(T.Button, {variant:'secondary'}, 'Retake'),
      h(T.Button, {variant:'tertiary'}, 'Skip step'),
      h(T.Button, {variant:'danger'}, 'Delete job'),
      h(T.Button, {variant:'secondary', disabled:true}, 'Syncing')),
    h('div', {style:{display:'flex', gap:8, maxWidth:380}},
      h(T.Button, {variant:'primary', size:'field', block:true}, 'Check my work'),
      h(T.Button, {variant:'secondary', size:'field', icon:'mic', iconOnly:true, 'aria-label':'Hold to talk'}))));
</script>
</body>
</html>
