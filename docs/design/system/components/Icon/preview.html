<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="root" style="display:grid;gap:12px;padding:16px"></div>
<script>
  var T = window.Tandrix, h = React.createElement;
  var names = ['check','user','alert','info','eyeOff','stop','clock','book','video','camera','monitor','file','mic','power','gauge','arrowRight','retake','glasses','laptop','phone','x','pointer','hand'];
  var row = function (size) {
    return h('div', { className: 'tx-row', style: { gap: 16, padding: 0, alignItems: 'center' } },
      h('span', { className: 'label-12', style: { width: 72, color: 'var(--text-secondary)' } }, size === 16 ? 'Solid 16' : 'Outline 24'),
      names.map(function (n) { return h(T.Icon, { key: n, name: n, size: size, label: n }); }));
  };
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, row(16), row(24)));
</script>
</body>
</html>
