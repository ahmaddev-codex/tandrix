<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 288px; background: var(--background-100); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--background-100); }
  .cv svg { position: absolute; left: 0; top: 0; }
  .ink { fill: var(--gray-1000); }
  .tint { fill: var(--gray-300); }
  .line { fill: var(--gray-200); }
  .blue { fill: var(--highlight); }
  .halo { fill: none; stroke: var(--highlight-halo); stroke-width: 5; }
  .ring { fill: none; stroke: var(--highlight); stroke-width: 2.5; }
  .key { fill: none; stroke: var(--highlight-keyline); stroke-width: 7; opacity: .55; }
  .plus { stroke: var(--gray-500); stroke-width: 1; }
  .r-lg { rx: var(--radius-lg); }
  .name { position: absolute; left: 48px; bottom: 64px; margin: 0; font-family: var(--font-sans); font-weight: 600; font-size: 100px; line-height: .92; letter-spacing: -5px; color: var(--text); }
  .tag { position: absolute; left: 52px; bottom: 36px; margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--text-secondary); max-width: 440px; }
</style>
</head>
<body>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: gray-1000 slab 288x288 (x 672), gray-300 field 168x240 (x 480), highlight block 96x96 (space-16 + space-8), all radius-lg
      arrangement: one tall ink slab bleeding off the right edge, a tint field to its left, a blue square set into the slab's lower-left corner
      pattern: plus grid at space-6 pitch on the tint field; "precise, technical, mono, a 4px grid" -> a plus grid. One highlight ring (the field highlight stack) circles a plus, the system's own motif
      scales: pitch space-6 (24), gap space-6, radius radius-lg (12); ring r 48, halo 5, stroke 2.5 from the highlight spec
    -->
    <rect class="tint r-lg" x="480" y="24" width="168" height="240"/>
    <g>
      <path class="plus" d="M504 48h8M508 44v8M528 48h8M532 44v8M552 48h8M556 44v8M576 48h8M580 44v8M600 48h8M604 44v8M624 48h8M628 44v8"/>
      <path class="plus" d="M504 96h8M508 92v8M528 96h8M532 92v8M552 96h8M556 92v8M576 96h8M580 92v8M600 96h8M604 92v8M624 96h8M628 92v8"/>
      <path class="plus" d="M504 144h8M508 140v8M528 144h8M532 140v8M600 144h8M604 140v8M624 144h8M628 140v8"/>
      <path class="plus" d="M504 192h8M508 188v8M528 192h8M532 188v8M552 192h8M556 188v8M576 192h8M580 188v8M600 192h8M604 188v8M624 192h8M628 188v8"/>
      <path class="plus" d="M504 240h8M508 236v8M528 240h8M532 236v8M552 240h8M556 236v8M576 240h8M580 236v8M600 240h8M604 236v8M624 240h8M628 236v8"/>
      <path class="plus" style="stroke: var(--gray-1000); stroke-width: 1.5" d="M562 144h12M568 138v12"/>
      <circle class="key" cx="568" cy="144" r="40"/>
      <circle class="halo" cx="568" cy="144" r="40"/>
      <circle class="ring" cx="568" cy="144" r="40"/>
    </g>
    <rect class="ink r-lg" x="672" y="0" width="300" height="288"/>
    <rect class="blue r-lg" x="696" y="168" width="96" height="96"/>
  </svg>
  <h1 class="name">Tandrix</h1>
  <p class="tag">See it. Understand it. Make it work.</p>
</div>
</body>
</html>
