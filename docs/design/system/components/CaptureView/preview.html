<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="root" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:16px"></div>
<script>
  var T = window.Tandrix, h = React.createElement;
  function pump(w){return h('svg',{viewBox:'0 0 360 270',preserveAspectRatio:'xMidYMid slice',style:{width:w||'100%',height:'auto',display:'block'}},
  h('defs',null,
    h('linearGradient',{id:'cc',x1:0,y1:0,x2:1,y2:1},h('stop',{offset:0,stopColor:'#7a8287'}),h('stop',{offset:1,stopColor:'#4c5459'})),
    h('radialGradient',{id:'br',cx:.4,cy:.35,r:.8},h('stop',{offset:0,stopColor:'#d2bc8e'}),h('stop',{offset:1,stopColor:'#8f7a50'})),
    h('radialGradient',{id:'st',cx:.35,cy:.3,r:.9},h('stop',{offset:0,stopColor:'#b9c1c6'}),h('stop',{offset:1,stopColor:'#6e777d'}))),
  h('rect',{width:360,height:270,fill:'url(#cc)'}),
  h('circle',{cx:180,cy:140,r:112,fill:'url(#st)',stroke:'#545c61',strokeWidth:3}),
  [40,95,140,185,240,275,320,0].map(function(a,i){var t=a*Math.PI/180;return h('circle',{key:i,cx:180+100*Math.cos(t),cy:140+100*Math.sin(t),r:6,fill:'#3f464b'})}),
  h('circle',{cx:180,cy:140,r:86,fill:'none',stroke:'#1c1e20',strokeWidth:7}),
  h('circle',{cx:180,cy:140,r:58,fill:'url(#br)',stroke:'#6e5e3c',strokeWidth:2}),
  [20,80,140,200,260,320].map(function(a,i){return h('ellipse',{key:i,cx:180,cy:108,rx:6,ry:24,fill:'#7e6a43',transform:'rotate('+a+' 180 140)'})}),
  h('circle',{cx:180,cy:140,r:11,fill:'#3a3f43'}))}
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(T.CaptureView, {state:'live', source:'phone', hint:'Show the open housing from the front', onSwitchSource:function(){}}, pump()),
    h(T.CaptureView, {state:'preview', source:'glasses', useLabel:'Use photo'}, pump()),
    h(T.CaptureView, {state:'analyzing', source:'phone', analyzingLabel:'Finding the impeller'}, pump())));
</script>
</body>
</html>
