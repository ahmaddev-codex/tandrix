name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The website as Cloudflare runs it: builds, and fits a Worker.
      - run: pnpm --filter @tandrix/web build:worker
      - run: pnpm --filter @tandrix/web exec wrangler deploy --dry-run --outdir .open-next/dry-run
